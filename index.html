function deleteSession(sid){
  const s = state.sessions.find(x=>x.id===sid);
  if(!s) return;
  if(!confirm(`למחוק לצמיתות את מפגש #${s.number} ואת כל הנתונים שלו? הפעולה הזו תעדכן את כל הסטטיסטיקות ולא ניתנת לביטול.`)) return;
  saveSafetyBackup('לפני מחיקת מפגש #'+s.number);
  state.sessions = state.sessions.filter(x=>x.id!==sid);
  if(state.currentSessionId===sid) state.currentSessionId=null;
  if(viewingPastSessionId===sid) viewingPastSessionId=null;
  saveState();
  toast('המפגש נמחק');
  render();
}
function deleteMatch(sid, mid){
  const s = state.sessions.find(x=>x.id===sid);
  if(!s) return;
  if(!confirm('למחוק את המשחק הזה מהמפגש? זה יעדכן את הסטטיסטיקות.')) return;
  saveSafetyBackup('לפני מחיקת משחק ממפגש #'+s.number);
  s.matches = s.matches.filter(x=>x.id!==mid);
  saveState();
  toast('המשחק נמחק');
  render();
}
function manualAddPlayer(){
  const el = document.getElementById('manualNewPlayer');
  const genderSel = document.getElementById('manualNewPlayerGender');
  const name = el.value.trim();
  if(!name) return;
  if(!state.players.includes(name)){ state.players.push(name); }
  if(genderSel && genderSel.value) setPlayerGender(name, genderSel.value);
  saveState(); toast('נוסף שחקן: '+name); render();
}
function deletePlayer(name){
  const inLiveSession = getActiveSession() && getActiveSession().playersPresent.includes(name) && !getActiveSession().finished;
  const warn = inLiveSession
    ? `${name} משתתף/ת במפגש הפעיל כרגע. מחיקה תסיר אותו/ה מרשימת השחקנים לבחירה עתידית, אבל לא תשנה את המפגש הנוכחי או ההיסטוריה. להמשיך?`
    : `למחוק את ${name} מרשימת השחקנים? זה יסיר אותו/ה מהבחירה למפגשים חדשים, אבל לא ימחק היסטוריה או סטטיסטיקות קיימות שלו/ה. להמשיך?`;
  if(!confirm(warn)) return;
  saveSafetyBackup('לפני מחיקת שחקן: '+name);
  state.players = state.players.filter(p=>p!==name);
  if(state.genders && state.genders[name] !== undefined) delete state.genders[name];
  saveState(); toast('השחקן/ית נמחק/ה מהרשימה'); render();
}

function updateProfileField(name, field, value){
  if(!state.profiles) state.profiles = {};
  if(!state.profiles[name]) state.profiles[name] = Object.assign({}, EMPTY_PROFILE);
  state.profiles[name][field] = value;
  saveState(); render();
}
function manualEditScore(sid, mid, side, val){
  const m = state.sessions.find(s=>s.id===sid).matches.find(x=>x.id===mid);
  const n = Math.max(0, parseInt(val,10)||0);
  if(side==='A') m.pointsA=n; else m.pointsB=n;
  recomputeMatchResult(m);
  saveState(); toast('עודכן');
}
function manualEditIndiv(sid, mid, player, field, val){
  const m = state.sessions.find(s=>s.id===sid).matches.find(x=>x.id===mid);
  const n = Math.max(0, parseInt(val,10)||0);
  m.individual[player][field] = n;
  saveState(); toast('עודכן');
}
function manualToggleStar(sid, mid, val){
  const m = state.sessions.find(s=>s.id===sid).matches.find(x=>x.id===mid);
  m.star = val; saveState();
}
function manualToggleFinished(sid, val){
  state.sessions.find(s=>s.id===sid).finished = val; saveState(); render();
}
function recomputeMatchResult(m){
  if(m.pointsA===m.pointsB) return;
  m.winner = m.pointsA>m.pointsB?'A':'B';
  m.finished = true;
  const loserPts = m.winner==='A'?m.pointsB:m.pointsA;
  m.star = (loserPts===0);
}
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'padel-league-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('קובץ הגיבוי הורד בהצלחה');
}
function importData(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!data.sessions || !data.players) throw new Error('invalid');
      state = data;
      saveState();
      toast('הנתונים שוחזרו בהצלחה');
      render();
    }catch(err){ toast('קובץ לא תקין'); }
  };
  reader.readAsText(file);
}

/* ======================= INIT ======================= */
render();
</script>
</body>
</html>

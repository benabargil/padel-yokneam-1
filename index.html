<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>ליגת פאדל | החברים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#0E1A20;
    --bg-grad:#0A3A34;
    --panel:#152A30;
    --panel2:#1C3941;
    --panel3:#20444D;
    --line-c:#2C4B53;
    --ball:#D8EA4B;
    --ball-dim:#8A9A38;
    --court:#1D8A73;
    --court-dim:#136354;
    --clay:#E3703C;
    --gold:#F0C24B;
    --text:#F3F1E7;
    --text-dim:#94ADB2;
    --text-dim2:#5F7C82;
    --danger:#E2543B;
    --radius:14px;
    --font-display:'Rajdhani',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'Space Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, var(--bg-grad) 0%, transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  ::selection{background:var(--ball);color:#12210F;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:.01em;}
  .app-shell{max-width:820px;margin:0 auto;padding:0 16px 60px;}
  /* ---------- Header / Nav ---------- */
  header.topbar{
    position:sticky;top:0;z-index:40;
    background:rgba(14,26,32,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line-c);
  }
  .topbar-inner{max-width:820px;margin:0 auto;padding:14px 16px 10px;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .brand-mark{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(145deg,var(--court),var(--court-dim));
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--ball);
    border:1px solid rgba(216,234,75,.35);
    flex-shrink:0;
  }
  .brand h1{font-size:21px;font-weight:700;color:var(--text);}
  .brand span.sub{display:block;font-size:11px;color:var(--text-dim);font-family:var(--font-body);font-weight:500;letter-spacing:.03em;margin-top:1px;}
  nav.tabs{display:flex;gap:6px;background:var(--panel);padding:4px;border-radius:12px;border:1px solid var(--line-c);}
  nav.tabs button{
    flex:1;background:transparent;border:none;color:var(--text-dim);
    font-family:var(--font-display);font-weight:600;font-size:15px;
    padding:9px 6px;border-radius:9px;transition:.15s;
  }
  nav.tabs button.active{background:var(--court);color:#EAFFF9;box-shadow:0 2px 8px rgba(29,138,115,.4);}
  nav.tabs button:not(.active):hover{color:var(--text);background:var(--panel2);}

  main{padding-top:18px;}
  .card{
    background:var(--panel);
    border:1px solid var(--line-c);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:16px;
  }
  .card h2{font-size:20px;margin-bottom:4px;}
  .card h2 + p.hint{margin-top:4px;}
  p.hint{color:var(--text-dim);font-size:13px;margin:0 0 14px;line-height:1.5;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;background:var(--panel2);border:1px solid var(--line-c);color:var(--text);
    padding:10px 12px;border-radius:9px;font-family:var(--font-body);font-size:14.5px;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--ball);outline-offset:1px;border-color:transparent;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:var(--court);color:#EAFFF9;border:none;font-family:var(--font-display);
    font-weight:700;font-size:15px;padding:11px 20px;border-radius:10px;
    transition:.15s;letter-spacing:.01em;
  }
  .btn:hover{filter:brightness(1.12);transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{opacity:.35;cursor:not-allowed;filter:none;transform:none;}
  .btn.accent{background:var(--ball);color:#1C2606;}
  .btn.ghost{background:transparent;border:1px solid var(--line-c);color:var(--text);}
  .btn.ghost:hover{background:var(--panel2);}
  .btn.danger{background:var(--danger);color:#fff;}
  .btn.sm{padding:7px 12px;font-size:13px;border-radius:8px;}
  .btn.block{width:100%;}
  .chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--panel2);
    border:1px solid var(--line-c);color:var(--text);padding:9px 14px;border-radius:999px;
    font-family:var(--font-display);font-weight:600;font-size:14.5px;transition:.15s;
  }
  .chip:hover{border-color:var(--text-dim2);}
  .chip.selectable{cursor:pointer;}
  .chip.selected{background:var(--ball);color:#1C2606;border-color:var(--ball);}
  .chip.selected.b{background:var(--clay);color:#2B0F05;border-color:var(--clay);}
  .chip.disabled{opacity:.3;cursor:not-allowed;}
  .chip.player{cursor:pointer;user-select:none;}
  .chip.player.checked{background:var(--court);border-color:var(--court);color:#EAFFF9;}
  .divider{height:1px;background:var(--line-c);margin:16px 0;}
  .badge{display:inline-block;background:var(--panel3);color:var(--text-dim);font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600;}
  .badge.gold{background:rgba(240,194,75,.15);color:var(--gold);}
  .empty{text-align:center;color:var(--text-dim);padding:36px 12px;font-size:14px;}
  .empty .big{font-size:34px;margin-bottom:6px;}

  /* ---------- Home / dashboard ---------- */
  .hero{
    border-radius:var(--radius);padding:26px 20px;margin-bottom:16px;
    background:
      radial-gradient(circle at 90% 0%, rgba(216,234,75,.16), transparent 55%),
      linear-gradient(155deg,var(--court-dim),#0F2A28 70%);
    border:1px solid rgba(29,138,115,.4);
    position:relative;overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;inset:0;opacity:.10;
    background-image:repeating-linear-gradient(90deg, transparent, transparent 38px, var(--ball) 38px, var(--ball) 40px);
    pointer-events:none;
  }
  .hero h2{font-size:26px;margin-bottom:6px;}
  .hero p{color:var(--text-dim);font-size:14px;max-width:480px;line-height:1.6;margin:0 0 16px;}
  .session-row{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:13px 14px;background:var(--panel2);border-radius:10px;border:1px solid var(--line-c);
    margin-bottom:8px;cursor:pointer;transition:.15s;
  }
  .session-row:hover{border-color:var(--ball-dim);}
  .session-row .num{font-family:var(--font-display);font-weight:700;font-size:17px;}
  .session-row .meta{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .session-row .stats{font-size:12px;color:var(--text-dim);text-align:left;}

  /* ---------- Scoreboard (signature element) ---------- */
  .scoreboard{
    border-radius:16px;overflow:hidden;border:1px solid var(--line-c);
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    margin-bottom:16px;position:relative;
  }
  .scoreboard::after{
    content:"";position:absolute;left:0;right:0;top:50%;height:2px;
    background:repeating-linear-gradient(90deg, var(--ball) 0 10px, transparent 10px 18px);
    opacity:.5;
  }
  .sb-timer{
    display:flex;align-items:center;justify-content:center;gap:14px;
    padding:12px;border-bottom:1px solid var(--line-c);
    font-family:var(--font-mono);
  }
  .sb-timer .time{font-size:26px;font-weight:700;letter-spacing:.04em;color:var(--ball);}
  .sb-timer .status{font-size:11px;color:var(--text-dim);font-family:var(--font-body);}
  .sb-pairs{display:grid;grid-template-columns:1fr 1fr;}
  .sb-pair{padding:20px 14px;text-align:center;position:relative;}
  .sb-pair.a{border-left:1px solid var(--line-c);}
  .sb-pair .names{font-size:13px;color:var(--text-dim);margin-bottom:8px;font-weight:600;min-height:34px;}
  .sb-pair .score{font-family:var(--font-mono);font-size:52px;font-weight:700;line-height:1;color:var(--text);}
  .sb-pair .score.win{color:var(--ball);}
  .sb-pair .deuce-tag{font-size:11px;color:var(--clay);margin-top:6px;font-weight:700;font-family:var(--font-body);}
  .sb-pair .star{color:var(--gold);font-size:13px;margin-top:8px;}

  .teams-wrap{display:flex;flex-direction:column;gap:12px;padding:0 14px 16px;}
  .team-block{border-radius:12px;padding:12px;border:1px solid var(--line-c);background:var(--panel3);}
  .team-block.a{border-top:3px solid var(--ball);}
  .team-block.b{border-top:3px solid var(--clay);}
  .team-label{font-family:var(--font-display);font-weight:700;font-size:12.5px;color:var(--text-dim);margin-bottom:8px;text-align:center;letter-spacing:.03em;}
  .team-players{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .player-ctrl{
    background:var(--panel2);border:1px solid var(--line-c);border-radius:12px;padding:10px;
  }
  .player-ctrl .pname{font-family:var(--font-display);font-weight:700;font-size:15px;margin-bottom:8px;text-align:center;}
  .player-ctrl .pstats{text-align:center;font-size:11px;color:var(--text-dim);margin-top:8px;font-family:var(--font-mono);}
  .pbtn{border:none;border-radius:8px;font-family:var(--font-display);font-weight:700;}
  .pbtn.pos-main{
    width:100%;background:var(--court);color:#EAFFF9;padding:12px 6px;font-size:14.5px;
  }
  .pbtn.pos-main:hover{filter:brightness(1.15);}
  .pbtn.pos-main:disabled{opacity:.35;}
  .err-row{display:flex;gap:6px;margin-top:7px;}
  .pbtn.err{flex:1;padding:8px 4px;font-size:11.5px;background:transparent;}
  .pbtn.err.net{border:1px solid var(--clay);color:var(--clay);}
  .pbtn.err.net:hover{background:rgba(227,112,60,.12);}
  .pbtn.err.glass{border:1px solid var(--text-dim2);color:var(--text-dim);}
  .pbtn.err.glass:hover{background:rgba(148,173,178,.12);}
  .pbtn:disabled{opacity:.35;cursor:not-allowed;}

  .game-actions{display:flex;gap:8px;padding:0 14px 16px;}

  /* ---------- Tables ---------- */
  table.stat-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.stat-table th{
    text-align:right;color:var(--text-dim);font-size:11px;text-transform:uppercase;letter-spacing:.04em;
    padding:6px 8px;border-bottom:1px solid var(--line-c);font-weight:600;
  }
  table.stat-table td{padding:9px 8px;border-bottom:1px solid rgba(44,75,83,.5);}
  table.stat-table tr:last-child td{border-bottom:none;}
  table.stat-table tr.top1 td:first-child{color:var(--gold);font-weight:700;}
  .rank{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;background:var(--panel3);border-radius:6px;font-family:var(--font-mono);font-size:11px;margin-left:6px;}
  .badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:12px;}
  .badge-card{background:var(--panel3);border:1px solid var(--line-c);border-radius:14px;padding:14px;text-align:center;}
  .badge-emoji{font-size:32px;margin-bottom:6px;}
  .badge-title{font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--text);margin-bottom:4px;}
  .badge-player{color:var(--ball);font-weight:700;font-size:14px;margin-bottom:2px;}
  .badge-desc{color:var(--text-dim);font-size:11.5px;}
  .pos-n{color:var(--court);font-weight:700;}
  .neg-n{color:var(--danger);font-weight:700;}
  .stat-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;}
  .stat-tabs button{
    white-space:nowrap;background:var(--panel2);border:1px solid var(--line-c);color:var(--text-dim);
    font-family:var(--font-display);font-weight:600;font-size:13.5px;padding:7px 13px;border-radius:999px;
  }
  .stat-tabs button.active{background:var(--ball);color:#1C2606;border-color:var(--ball);}
  canvas{max-width:100%;}
  select.player-select{max-width:220px;margin-bottom:14px;}

  /* summary */
  .summary-text p{line-height:1.75;font-size:14.5px;margin:0 0 10px;}
  .summary-text strong{color:var(--ball);}
  .mvp-banner{
    display:flex;align-items:center;gap:12px;background:linear-gradient(120deg, rgba(240,194,75,.18), transparent);
    border:1px solid rgba(240,194,75,.4);border-radius:12px;padding:14px;margin-bottom:16px;
  }
  .mvp-banner .trophy{font-size:30px;}
  .mvp-banner .name{font-family:var(--font-display);font-weight:700;font-size:19px;color:var(--gold);}
  .mvp-banner .label{font-size:11px;color:var(--text-dim);}

  .manual-edit-item{border:1px solid var(--line-c);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--panel2);}
  .manual-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
  .manual-grid .field{margin-bottom:0;}
  .footer-note{text-align:center;color:var(--text-dim2);font-size:11.5px;margin-top:30px;line-height:1.6;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--panel3);border:1px solid var(--ball);color:var(--text);
    padding:10px 18px;border-radius:999px;font-size:13.5px;z-index:100;
    box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.25s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .voice-flash{
    position:fixed;inset:0;z-index:300;background:var(--court);
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;
    opacity:0;pointer-events:none;transition:opacity .12s ease;
  }
  .voice-flash.show{opacity:1;}
  .voice-flash.neg{background:var(--clay);}
  .voice-flash.fail{background:var(--danger);}
  .voice-flash-icon{font-size:130px;line-height:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,.3));}
  .series-flash{
    position:fixed;inset:0;z-index:310;background:var(--court);
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
    opacity:0;pointer-events:none;transition:opacity .15s ease;text-align:center;padding:20px;
  }
  .series-flash.show{opacity:1;}
  .series-flash.decided{background:var(--gold);}
  .series-flash-icon{font-size:110px;line-height:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,.3));}
  .series-flash-title{font-family:var(--font-display);font-weight:800;font-size:30px;color:#0E1A20;}
  .series-flash-sub{font-family:var(--font-body);font-size:18px;color:#0E1A20;opacity:.85;}
  .voice-bar{padding:0 14px 14px;}
  .voice-bar .btn{width:100%;}
  .voice-bar .btn.listening{background:var(--danger);color:#fff;animation:pulseListen 1.4s ease-in-out infinite;}
  @keyframes pulseListen{0%,100%{opacity:1;}50%{opacity:.75;}}
  .vision-box{border:1px dashed var(--line-c);border-radius:10px;padding:12px 14px;margin-top:6px;}
  .vision-box p{font-size:12.5px;color:var(--text-dim2);margin:0;line-height:1.6;}
  @media(max-width:480px){
    .sb-pair .score{font-size:40px;}
    .manual-grid{grid-template-columns:1fr;}
  }
  @media(max-width:360px){
    .team-players{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">P</div>
      <div>
        <h1>ליגת הפאדל</h1>
        <span class="sub">מעקב מפגשים, תוצאות וסטטיסטיקה של החבר׳ה</span>
      </div>
    </div>
    <nav class="tabs" id="mainTabs"></nav>
  </div>
</header>
<div class="app-shell">
  <main id="viewRoot"></main>
  <div class="footer-note">כל הנתונים נשמרים בדפדפן שלך (localStorage) ולא נמחקים בין מפגשים.<br>מומלץ לגבות מדי פעם מתוך "עריכה ידנית → גיבוי".</div>
</div>
<div class="toast" id="toast"></div>
<div class="voice-flash" id="voiceFlash"><div class="voice-flash-icon" id="voiceFlashIcon">✅</div></div>
<div class="series-flash" id="seriesFlash">
  <div class="series-flash-icon" id="seriesFlashIcon">🏆</div>
  <div class="series-flash-title" id="seriesFlashTitle"></div>
  <div class="series-flash-sub" id="seriesFlashSub"></div>
</div>
<div id="errBanner" style="display:none;position:fixed;bottom:0;left:0;right:0;z-index:99999;background:#3a0d0d;color:#ffb4b4;padding:14px 16px;font-family:monospace;font-size:13px;direction:ltr;text-align:left;max-height:40vh;overflow:auto;border-top:3px solid #ff4d4d;white-space:pre-wrap;"></div>

<script>
window.addEventListener('error', function(e){
  const b = document.getElementById('errBanner');
  if(!b) return;
  b.style.display='block';
  b.textContent = 'שגיאה: ' + (e.message||'') + '\n' + (e.filename? (e.filename+':'+e.lineno+':'+e.colno) : '') + (e.error && e.error.stack ? ('\n'+e.error.stack) : '');
});
window.addEventListener('unhandledrejection', function(e){
  const b = document.getElementById('errBanner');
  if(!b) return;
  b.style.display='block';
  b.textContent = 'שגיאה (promise): ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
});
/* ======================= STATE / STORAGE (Firebase Realtime Database, synced across everyone) ======================= */
const STORAGE_KEY = 'padelLeagueData_v1'; // used only as a local offline cache now
const firebaseConfig = {
  apiKey: "AIzaSyAffq4yotO3_aCV0KPextHdYBERwHLxg8A",
  authDomain: "padel-yokneam.firebaseapp.com",
  databaseURL: "https://padel-yokneam-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "padel-yokneam",
  storageBucket: "padel-yokneam.firebasestorage.app",
  messagingSenderId: "502667316701",
  appId: "1:502667316701:web:820d2cad6ed7f2c0e37a34",
  measurementId: "G-FGTNHZ8867"
};
firebase.initializeApp(firebaseConfig);
const dbRef = firebase.database().ref('leagueData');
const backupsRef = firebase.database().ref('leagueBackups');
let firebaseReady = false;
let suppressNextRemoteEcho = false;
let safetyBackupsList = [];
let safetyBackupsLoading = false;
// Snapshots the whole state to a separate Firebase path right before a destructive action (delete
// session/match/player), so an accidental deletion by anyone in the group is always recoverable.
// Keeps only the 10 most recent snapshots.
function saveSafetyBackup(reason){
  try{
    backupsRef.push({ timestamp: Date.now(), reason, data: JSON.stringify(state) });
    backupsRef.orderByChild('timestamp').once('value', snap=>{
      const items = [];
      snap.forEach(child=>{ items.push({key:child.key, timestamp:(child.val()||{}).timestamp||0}); });
      items.sort((a,b)=>a.timestamp-b.timestamp);
      while(items.length>10){ backupsRef.child(items.shift().key).remove(); }
    });
  }catch(e){ console.error('safety backup error', e); }
}
function loadSafetyBackups(){
  safetyBackupsLoading = true; render();
  backupsRef.orderByChild('timestamp').once('value', snap=>{
    const items = [];
    snap.forEach(child=>{ items.push(Object.assign({key:child.key}, child.val())); });
    items.sort((a,b)=>b.timestamp-a.timestamp);
    safetyBackupsList = items;
    safetyBackupsLoading = false;
    render();
  }, err=>{ console.error('load backups error', err); safetyBackupsLoading=false; toast('שגיאה בטעינת גיבויים'); render(); });
}
function restoreSafetyBackup(key){
  const entry = safetyBackupsList.find(b=>b.key===key);
  if(!entry) return;
  if(!confirm('לשחזר לנקודת הזמן הזו? כל שינוי שנעשה אחרי הגיבוי הזה יימחק (המצב הנוכחי יישמר כגיבוי חדש קודם, ליתר ביטחון).')) return;
  try{
    saveSafetyBackup('לפני שחזור ידני');
    const data = sanitizeState(JSON.parse(entry.data));
    state = data;
    saveState();
    toast('שוחזר בהצלחה מהגיבוי');
    render();
  }catch(e){ console.error('restore error', e); toast('שגיאה בשחזור מהגיבוי'); }
}

const EMPTY_PROFILE = { avatar:'🎾', racketBrand:'', racketModel:'', hand:'', side:'', nickname:'', catchphrase:'', since:'' };
function sanitizeState(s){

  Object.keys(s.profiles).forEach(p=>{

}

function combos2(arr){

function pairKey(pair){ return [...pair].sort((a,b)=>a.localeCompare(b,'he')).join(' ו-'); }
function fmtDate(d){

function fmtTime(sec){
  sec = Math.max(0,Math.floor(sec));
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = (sec%60).toString().padStart(2,'0');
  return m+':'+s;
}
function hashStr(str){
  let h=0; for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  return h;
}
let __pickUsage = null; // tracks which template variants were already used in the current summary render, to avoid repeats across players
function pick(arr, seedStr){
  const idx = hashStr(seedStr) % arr.length;
  if(!__pickUsage || arr.length<=1) return arr[idx];
  let used = __pickUsage.get(arr);
  if(!used){ used = new Set(); __pickUsage.set(arr, used); }
  if(used.size >= arr.length) used.clear(); // every variant used at least once — start a fresh cycle
  let candidate = idx, attempts = 0;
  while(used.has(candidate) && attempts < arr.length){
    candidate = (candidate+1) % arr.length;
    attempts++;
  }
  used.add(candidate);
  return arr[candidate];
}

/* ======================= SCORE ENGINE ======================= */
function computeScore(a,b){
  if(a>=4 && a-b>=2) return {over:true, winner:'A', labelA:'ניצחון', labelB:''};
  if(b>=4 && b-a>=2) return {over:true, winner:'B', labelA:'', labelB:'ניצחון'};
  let labelA, labelB, deuce=false;
  if(a>=3 && b>=3){
    const diff=a-b;
    if(diff===0){ labelA='40'; labelB='40'; deuce=true; }
    else if(diff===1){ labelA='יתרון'; labelB='40'; }
    else { labelA='40'; labelB='יתרון'; }
  } else {
    const arr=['0','15','30'];
    labelA = a>=3 ? '40' : arr[a];
    labelB = b>=3 ? '40' : arr[b];
  }
  return {over:false, labelA, labelB, deuce};
}

function newMatch(pairA, pairB, seriesId, seriesGameIndex){
  const individual = {};
  [...pairA, ...pairB].forEach(p=> individual[p] = {pos:0, negNet:0, negGlass:0});
  return {
    id: uid(),
    pairA, pairB,
    pointsA:0, pointsB:0,
    individual,
    events: [],
    winner: null,
    star: false,
    finished: false,
    elapsed: 0,
    paused: true,
    startedAt: null,
    seriesId: seriesId || null,
    seriesGameIndex: seriesGameIndex || null,
  };
}
function negTotal(ind){ return (ind.negNet||0) + (ind.negGlass||0); }

function addPoint(match, actingPair, kind, player){
  if(match.finished) return;
  if(kind==='pos'){
    if(actingPair==='A') match.pointsA++; else match.pointsB++;
    match.individual[player].pos++;
  } else {
    // kind is 'negNet' or 'negGlass' — the error's own pair loses the point to the opponent
    if(actingPair==='A') match.pointsB++; else match.pointsA++;
    match.individual[player][kind]++;
  }
  match.events.push({actingPair, kind, player});
  const sc = computeScore(match.pointsA, match.pointsB);
  if(sc.over){
    match.finished = true;
    match.winner = sc.winner;
    const loserPts = sc.winner==='A' ? match.pointsB : match.pointsA;
    match.star = (loserPts === 0);
    match.paused = true;
  }
}

function undoLastPoint(match){
  const ev = match.events.pop();
  if(!ev) return;
  if(ev.kind==='pos'){
    if(ev.actingPair==='A') match.pointsA--; else match.pointsB--;
    match.individual[ev.player].pos--;
  } else {
    if(ev.actingPair==='A') match.pointsB--; else match.pointsA--;
    match.individual[ev.player][ev.kind]--;
  }
  if(match.finished){ match.finished=false; match.winner=null; match.star=false; }
}

/* ======================= VOICE COMMANDS ("תרשום נקודה לאבידן") ======================= */
let voiceListening = false;
let recognitionInstance = null;
const WAKE_WORDS = ['תרשום','תרשמו','תרשמי','תירשם','רשום'];
function voiceSupported(){
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}
function isIOSDevice(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent||'') && !window.MSStream;
}
function startVoiceRecognition(mid){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('זיהוי קול לא נתמך בדפדפן הזה'); voiceListening=false; return; }
  if(recognitionInstance){ try{ recognitionInstance.onend=null; recognitionInstance.stop(); }catch(e){} }
  recognitionInstance = new SR();
  recognitionInstance.lang = 'he-IL';
  // iOS has a known bug where continuous mode gets stuck — restart-loop there.
  // Everywhere else (Chrome, Edge, desktop Safari) continuous mode is reliable
  // and avoids re-requesting the microphone after every single phrase.
  recognitionInstance.continuous = !isIOSDevice();
  recognitionInstance.interimResults = false;
  recognitionInstance.maxAlternatives = 5; // Hebrew names often get mistranscribed slightly — trying several candidates improves match odds
  recognitionInstance.onresult = (e)=>{
    const res = e.results[e.results.length-1];
    const alternatives = [];
    for(let i=0;i<res.length;i++) alternatives.push(res[i].transcript);
    handleVoiceCommand(alternatives, mid);
  };
  recognitionInstance.onerror = (e)=>{
    console.warn('speech recognition error', e.error);
    if(e.error==='not-allowed' || e.error==='service-not-allowed'){
      toast('הגישה למיקרופון נחסמה — יש לאשר בהגדרות הדפדפן');
      voiceListening = false;
      render();
    }
  };
  recognitionInstance.onend = ()=>{
    if(voiceListening){
      setTimeout(()=>{ if(voiceListening && recognitionInstance){ try{ recognitionInstance.start(); }catch(e){} } }, 250);
    }
  };
  try{ recognitionInstance.start(); }catch(e){ console.warn(e); }
}
function stopVoiceRecognition(){
  voiceListening = false;
  if(recognitionInstance){
    try{ recognitionInstance.onend=null; recognitionInstance.stop(); }catch(e){}
    recognitionInstance = null;
  }
}
function toggleVoice(mid){
  if(voiceListening){ stopVoiceRecognition(); }
  else { voiceListening = true; startVoiceRecognition(mid); }
  render();
}
// iOS/Siri dictation "smart-punctuates" the spoken word "נקודה" into a literal "." (the same way
// saying "period" in English dictation types a punctuation mark instead of the word) — this undoes
// that so command parsing still sees the word it's looking for, regardless of dictation source.
function normalizeDictationPunctuation(text){
  return (text||'').replace(/\./g, ' נקודה ').replace(/\s+/g,' ').trim();
}
function handleVoiceCommand(transcriptOrList, mid){
  const s = getActiveSession();
  const m = s && s.matches.find(x=>x.id===mid);
  if(!m || m.finished) return;
  const candidates = (Array.isArray(transcriptOrList) ? transcriptOrList : [transcriptOrList]).filter(Boolean).map(normalizeDictationPunctuation);
  const allPlayers = [...m.pairA, ...m.pairB];

  // Pass 1: exact substring match (fast path) — try every recognition alternative, not just the top guess.
  for(const raw of candidates){
    const text = raw.trim();
    let wakeIdx=-1, wakeLen=0;
    WAKE_WORDS.forEach(w=>{
      const i = text.indexOf(w);
      if(i!==-1 && (wakeIdx===-1 || i<wakeIdx || (i===wakeIdx && w.length>wakeLen))){ wakeIdx=i; wakeLen=w.length; }
    });
    if(wakeIdx===-1) continue;
    const command = text.slice(wakeIdx+wakeLen).trim();
    let kind = null;
    if(command.includes('רשת')) kind='negNet';
    else if(command.includes('זכוכית') || command.includes('חוץ')) kind='negGlass';
    else if(command.includes('נקודה')) kind='pos';
    let matchedPlayer = null;
    allPlayers.forEach(p=>{ if(command.includes(p) && (!matchedPlayer || p.length>matchedPlayer.length)) matchedPlayer=p; });
    // Deliberately NOT defaulting to a positive point when a name is found but no kind keyword is —
    // if "זכוכית"/"רשת" got mis-heard or dropped by dictation, silently assuming "point" would flip
    // an error into a point, which is worse than just failing to recognize the command at all.
    if(matchedPlayer && kind){ commitVoiceCommand(mid, m, matchedPlayer, kind); return; }
  }

  // Pass 2: fuzzy fallback — speech recognition frequently mishears short Hebrew names/keywords by a letter or two.
  // Find the wake word (exactly or approximately) in any alternative, then fuzzy-match the rest against known players/keywords.
  let afterWake = null;
  outer:
  for(const raw of candidates){
    const text = raw.trim();
    for(const w of WAKE_WORDS){
      const i = text.indexOf(w);
      if(i!==-1){ afterWake = text.slice(i+w.length).trim(); break outer; }
    }
  }
  if(afterWake===null){
    outer2:
    for(const raw of candidates){
      const words = raw.trim().split(/\s+/).filter(Boolean);
      for(let i=0;i<words.length;i++){
        const isWakeish = WAKE_WORDS.some(ww => levenshteinRatio(ww, words[i]) <= 0.34);
        if(isWakeish){ afterWake = words.slice(i+1).join(' '); break outer2; }
      }
    }
  }
  if(afterWake===null){
    flashVoiceFeedback('fail');
    toast('לא זוהתה מילת הפעלה. נשמע: "'+(candidates[0]||'')+'"');
    return;
  }

  const fuzzyPlayer = fuzzyBestMatch(afterWake, allPlayers, 0.34);
  const fuzzyKindWord = fuzzyBestMatch(afterWake, ['רשת','זכוכית','חוץ','נקודה'], 0.34);
  let kind = null;
  if(fuzzyKindWord==='רשת') kind='negNet';
  else if(fuzzyKindWord==='זכוכית' || fuzzyKindWord==='חוץ') kind='negGlass';
  else if(fuzzyKindWord==='נקודה') kind='pos';
  // Same safety rule as pass 1: don't guess "point" just because only a name matched — see note above.

  if(fuzzyPlayer && kind){
    commitVoiceCommand(mid, m, fuzzyPlayer, kind);
    toast('זוהה בקירוב: '+(kind==='pos'?'נקודה':kind==='negNet'?'רשת':'זכוכית')+' ל'+fuzzyPlayer);
  } else {
    flashVoiceFeedback('fail');
    toast('לא זוהתה פקודה. נשמע: "'+(candidates[0]||'')+'"');
  }
}
function commitVoiceCommand(mid, m, matchedPlayer, kind){
  const pair = m.pairA.includes(matchedPlayer) ? 'A' : 'B';
  doPoint(mid, pair, kind, matchedPlayer);
  flashVoiceFeedback(kind==='pos' ? 'pos' : 'neg');
}
// Levenshtein edit distance, normalized to 0..1 (0 = identical, 1 = completely different)
function levenshteinRatio(a,b){
  a=a||''; b=b||'';
  const m=a.length, n=b.length;
  if(m===0 && n===0) return 0;
  const dp = [];
  for(let i=0;i<=m;i++){ dp.push(new Array(n+1).fill(0)); dp[i][0]=i; }
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
    }
  }
  return dp[m][n] / Math.max(m,n);
}
// Fuzzy-searches `candidates` (player names / action keywords) inside free-form `text`,
// by comparing each candidate against every 1-3 word window of the text and keeping the closest match.
function fuzzyBestMatch(text, candidates, maxRatio){
  const words = (text||'').split(/\s+/).filter(Boolean);
  if(!words.length) return null;
  let best=null, bestRatio=Infinity;
  candidates.forEach(cand=>{
    for(let start=0; start<words.length; start++){
      for(let len=1; len<=3 && start+len<=words.length; len++){
        const windowText = words.slice(start,start+len).join('');
        const ratio = levenshteinRatio(cand, windowText);
        if(ratio < bestRatio){ bestRatio = ratio; best = cand; }
      }
    }
  });
  return (best!==null && bestRatio<=maxRatio) ? best : null;
}
function flashVoiceFeedback(type){
  const el = document.getElementById('voiceFlash');
  const icon = document.getElementById('voiceFlashIcon');
  if(!el || !icon) return;
  const icons = { pos:'✅', neg:'⚠️', fail:'❓' };
  const vibrations = { pos:[80], neg:[70,50,70], fail:[40,60,40] };
  icon.textContent = icons[type] || '❓';
  el.classList.remove('neg','fail');
  if(type==='neg') el.classList.add('neg');
  if(type==='fail') el.classList.add('fail');
  el.classList.add('show');
  if(navigator.vibrate) navigator.vibrate(vibrations[type] || vibrations.fail);
  clearTimeout(flashVoiceFeedback._t);
  flashVoiceFeedback._t = setTimeout(()=> el.classList.remove('show'), type==='fail'?900:1100);
}

/* ======================= SESSION HELPERS ======================= */
function getActiveSession(){
  if(!state.currentSessionId) return null;
  return state.sessions.find(s=>s.id===state.currentSessionId) || null;
}
function createNewSession(){
  // Derive the number from the actual sessions on record, rather than trusting the separately-stored
  // nextSessionNumber counter — that counter can drift (e.g. after deleting sessions) and end up
  // suggesting a number like 15 when there are actually zero sessions left.
  const nextNum = state.sessions.length ? Math.max(...state.sessions.map(s=>s.number)) + 1 : 1;
  const s = {
    id: uid(),
    number: nextNum,
    date: new Date().toISOString().slice(0,10),
    playersPresent: [],
    matches: [],
    finished: false,
  };
  state.sessions.push(s);
  state.nextSessionNumber = nextNum+1;
  state.currentSessionId = s.id;
  saveState();
}

function esc(s){ return (s+'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Safe for embedding inside a single-quoted JS string literal that itself sits inside a double-quoted HTML attribute
// (e.g. onclick="fn('${jsAttr(name)}')"). Escaping order matters: JS-escape first, then HTML-escape the attribute delimiters,
// so names with apostrophes/quotes round-trip correctly instead of breaking out of the inline handler.
function jsAttr(s){

    .replace(/\\/g,'\\\\')
    .replace(/'/g,"\\'")
    .replace(/&/g,'&amp;')
    .replace(/"/g,'&quot;');
}

    return renderSummarySubview(session);
  }
  if(!session.pairsCache){
    return renderSetupSubview(session);
  }
  const activeMatch = session.matches.find(m=>!m.finished);
  if(activeMatch){
    return renderGameSubview(session, activeMatch);
  }
  return renderPairsSubview(session);
}

function getSortedUpcomingSessions(){
  return state.upcomingSessions.slice().sort((a,b)=> new Date(a.date+'T'+a.time) - new Date(b.date+'T'+b.time));
}
// The soonest upcoming session that hasn't happened yet (past ones are just left in the list — not
// auto-removed — so a next-time addition doesn't silently erase history of what was planned).
function getNextUpcomingSession(){
  const now = new Date();
  return getSortedUpcomingSessions().find(u => new Date(u.date+'T'+u.time) > now) || null;
}

  state.upcomingSessions.push({ id: uid(), date, time, location });

}
function deleteUpcomingSession(id){

// Ticks every second purely locally (no saveState/Firebase writes needed — every device can compute
// "time remaining" on its own from the stored target date/time). Only touches the DOM when the
// dashboard's countdown element actually exists, so it's a safe no-op on every other screen.
function startCountdownLoop(){
  setInterval(()=>{
    const el = document.getElementById('nextSessionCountdown');
    if(!el) return;
    const next = getNextUpcomingSession();
    if(!next) return;
    const target = new Date(next.date+'T'+next.time).getTime();
    const diff = target - Date.now();
    if(diff<=0){ el.textContent = '🎾 המפגש מתחיל עכשיו!'; return; }
    const days = Math.floor(diff/86400000);
    const hours = Math.floor((diff%86400000)/3600000);
    const mins = Math.floor((diff%3600000)/60000);
    const secs = Math.floor((diff%60000)/1000);
    const pad = n=>String(n).padStart(2,'0');
    el.textContent = days>0
      ? `בעוד ${days} ימים, ${pad(hours)}:${pad(mins)}:${pad(secs)}`
      : `בעוד ${pad(hours)}:${pad(mins)}:${pad(secs)}`;
  }, 1000);
}
startCountdownLoop();

function toggleTimer(mid){
  const s = getActiveSession(); const m = s.matches.find(x=>x.id===mid);
  m.paused = !m.paused;
  saveState(); render();
}
function doPoint(mid, pair, kind, player){
  const s = getActiveSession(); const m = s.matches.find(x=>x.id===mid);
  if(m.paused) m.paused = false;
  addPoint(m, pair, kind, player);
  if(m.finished && voiceListening){ stopVoiceRecognition(); toast('המשחק הסתיים — ההאזנה הקולית נעצרה'); }
  if(m.finished && m.seriesId){
    const wins = getSeriesWins(s, m.seriesId);
    const winPair = m.winner==='A' ? m.pairA : m.pairB;
    if(Math.max(wins.A, wins.B) >= 4){
      toast('🏆🏆 מערכה הסתיימה! '+winPair.join(' + ')+' ניצחו '+Math.max(wins.A,wins.B)+'-'+Math.min(wins.A,wins.B)+' במערכה');
      flashSeriesTransition({
        icon:'🏆', title:'המערכה הוכרעה!',
        sub: winPair.join(' + ')+' ניצחו '+Math.max(wins.A,wins.B)+'-'+Math.min(wins.A,wins.B),
        decided:true
      });
    } else {
      const next = newMatch(m.pairA, m.pairB, m.seriesId, m.seriesGameIndex+1);
      next.paused = false;
      next.startedAt = Date.now();
      s.matches.push(next);
      toast('🏆 '+winPair.join(' + ')+' ניצחו את המשחקון! מערכה: '+wins.A+'-'+wins.B+' — ממשיכים למשחקון הבא');
      flashSeriesTransition({
        icon:'✅', title:'משחקון '+m.seriesGameIndex+' הסתיים',
        sub: winPair.join(' + ')+' ניצחו · מערכה: '+wins.A+'-'+wins.B+' · מתחילים משחקון '+next.seriesGameIndex,
        decided:false
      });
    }
  }
  saveState(); render();
}
// Full-screen green transition shown for a beat between series mini-games, so the switch to a fresh
// 0-0 scoreboard doesn't feel like the app just glitched. Gold instead of green once the series is decided.
function flashSeriesTransition({icon, title, sub, decided}){
  const el = document.getElementById('seriesFlash');
  const iconEl = document.getElementById('seriesFlashIcon');
  const titleEl = document.getElementById('seriesFlashTitle');
  const subEl = document.getElementById('seriesFlashSub');
  if(!el || !iconEl || !titleEl || !subEl) return;
  iconEl.textContent = icon;
  titleEl.textContent = title;
  subEl.textContent = sub;
  el.classList.toggle('decided', !!decided);
  el.classList.add('show');
  if(navigator.vibrate) navigator.vibrate(decided ? [100,60,100,60,150] : [90]);
  clearTimeout(flashSeriesTransition._t);
  flashSeriesTransition._t = setTimeout(()=> el.classList.remove('show'), decided ? 2200 : 1500);
}
function doUndo(mid){
  const s = getActiveSession(); const m = s.matches.find(x=>x.id===mid);
  undoLastPoint(m); saveState(); render();
}
function forceEndMatch(mid){
  const s = getActiveSession(); const m = s.matches.find(x=>x.id===mid);
  if(m.pointsA===m.pointsB){ toast('אי אפשר לסיים בתיקו — הוסיפו עוד נקודה'); return; }
  m.finished = true;
  m.winner = m.pointsA>m.pointsB?'A':'B';
  const loserPts = m.winner==='A'?m.pointsB:m.pointsA;
  m.star = (loserPts===0);
  m.paused = true;
  saveState(); render();
}
function finishMatchReturn(sid){ render(); }

function endSession(sid){
  const s = state.sessions.find(x=>x.id===sid);
  s.finished = true;
  saveState();
  render();
}

/* ======================= SUMMARY (data-driven analysis) ======================= */
function findPreviousSessionStatsForPlayer(player, beforeSessionNumber){
  const past = allFinishedSessions().filter(s=>s.number<beforeSessionNumber).sort((a,b)=>b.number-a.number);
  for(const s of past){
    let pos=0, neg=0, matches=0, wins=0;
    s.matches.filter(m=>m.finished).forEach(m=>{
      if(m.individual[player]){
        matches++; pos+=m.individual[player].pos; neg+=negTotal(m.individual[player]);
        const winners = m.winner==='A'?m.pairA:m.pairB;
        if(winners.includes(player)) wins++;
      }
    });
    if(matches>0) return { sessionNumber:s.number, net:(pos-neg)/matches, winRate: wins/matches };
  }
  return null;
}

function computeSessionPlayerStats(session){
  const stats = {};
  session.playersPresent.forEach(p=> stats[p] = {pos:0, negNet:0, negGlass:0, neg:0, wins:0, matches:0});
  session.matches.filter(m=>m.finished).forEach(m=>{
    const inMatch = [...m.pairA, ...m.pairB];
    inMatch.forEach(p=>{
      if(!stats[p]) stats[p]={pos:0,negNet:0,negGlass:0,neg:0,wins:0,matches:0};
      stats[p].matches++;
      stats[p].pos += m.individual[p].pos;
      stats[p].negNet += m.individual[p].negNet;
      stats[p].negGlass += m.individual[p].negGlass;
      stats[p].neg = stats[p].negNet + stats[p].negGlass;
    });
    const winners = m.winner==='A'?m.pairA:m.pairB;
    winners.forEach(p=> stats[p].wins++);
  });
  return stats;
}

// If a match was won with one partner contributing much more (net points) than the other,
// flags who effectively carried the pair. Returns null when the match wasn't a clear carry situation.
function detectMatchCarry(m){
  if(!m.finished || !m.winner) return null;
  const winPair = m.winner==='A' ? m.pairA : m.pairB;
  const [p1, p2] = winPair;
  const net1 = (m.individual[p1]?.pos||0) - negTotal(m.individual[p1]||{});
  const net2 = (m.individual[p2]?.pos||0) - negTotal(m.individual[p2]||{});
  const gap = net1 - net2;
  if(Math.abs(gap) < 3) return null;
  return gap>0
    ? {carrier:p1, carried:p2, carrierNet:net1, carriedNet:net2}
    : {carrier:p2, carried:p1, carrierNet:net2, carriedNet:net1};
}

// Last `windowSize` finished sessions up to and including `uptoSessionNumber`, for the multi-session trend summary.
function computeTrendWindow(uptoSessionNumber, windowSize){
  const sessions = allFinishedSessions().filter(s=>s.number<=uptoSessionNumber);
  return sessions.slice(-windowSize);
}
function computeTrendStats(windowSessions){
  const stats = {};
  windowSessions.forEach(s=>{
    const sstats = computeSessionPlayerStats(s);
    Object.keys(sstats).forEach(p=>{
      if(sstats[p].matches===0) return;
      if(!stats[p]) stats[p] = {sessions:0, netSum:0, wins:0, matches:0, perSessionNet:[]};
      const net = sstats[p].pos - sstats[p].neg;
      stats[p].sessions++;
      stats[p].netSum += net;
      stats[p].wins += sstats[p].wins;
      stats[p].matches += sstats[p].matches;
      stats[p].perSessionNet.push(net);
    });
  });
  return stats;
}

function partnersWonWith(name, finishedMatches){
  const set = new Set();
  finishedMatches.forEach(m=>{
    const winPair = m.winner==='A'?m.pairA:m.pairB;
    if(winPair.includes(name)) set.add(winPair.find(x=>x!==name));
  });
  return [...set];
}
// All distinct partners a player played alongside today, win or lose (unlike partnersWonWith above).
function allPartnersFor(name, finishedMatches){
  const set = new Set();
  finishedMatches.forEach(m=>{
    [m.pairA, m.pairB].forEach(pair=>{
      if(pair.includes(name)) set.add(pair.find(x=>x!==name));
    });
  });
  return [...set];
}
function closestMatchFor(name, finishedMatches){
  let best = null;
  finishedMatches.forEach(m=>{
    if(![...m.pairA, ...m.pairB].includes(name)) return;
    const margin = Math.abs(m.pointsA - m.pointsB);
    if(!best || margin < best.margin) best = {margin, m};
  });
  return best;
}
function tpl(str, vars){
  return str.replace(/\{(\w+)\}/g, (_,k)=> vars[k]!==undefined ? vars[k] : '');
}

/* ---- Derived padel insights — computed entirely from the existing point log, no extra input ---- */
function isClutch(a,b){ return a>=3 && b>=3; }
function computeMatchInsights(m){
  let a=0, b=0;
  let curPlayer=null, curLen=0;
  const streaks = {};
  const clutchScored = {};
  const n = m.events.length;
  const halves = {};
  [...m.pairA, ...m.pairB].forEach(p=> halves[p] = {firstErr:0, firstTotal:0, secondErr:0, secondTotal:0});
  m.events.forEach((ev,i)=>{
    const clutch = isClutch(a,b);
    const half = i < n/2 ? 'first' : 'second';
    if(halves[ev.player]){
      halves[ev.player][half+'Total']++;
      if(ev.kind!=='pos') halves[ev.player][half+'Err']++;
    }
    if(ev.kind==='pos'){
      curLen = (ev.player===curPlayer) ? curLen+1 : 1;
      curPlayer = ev.player;
      if(!streaks[ev.player] || curLen>streaks[ev.player]) streaks[ev.player] = curLen;
    } else {
      curPlayer = null; curLen = 0;
    }
    if(clutch && ev.kind==='pos'){
      clutchScored[ev.player] = (clutchScored[ev.player]||0) + 1;
    }
    if(ev.kind==='pos'){ if(ev.actingPair==='A') a++; else b++; }
    else { if(ev.actingPair==='A') b++; else a++; }
  });
  return { streaks, clutchScored, halves };
}
function computeSessionInsights(session){
  const finished = session.matches.filter(m=>m.finished);
  const bestStreak = { player:null, len:0 };
  const clutchScoredTotal = {};
  const halvesAgg = {};
  finished.forEach(m=>{
    const ins = computeMatchInsights(m);
    Object.keys(ins.streaks).forEach(p=>{
      if(ins.streaks[p] > bestStreak.len){ bestStreak.len = ins.streaks[p]; bestStreak.player = p; }
    });
    Object.keys(ins.clutchScored).forEach(p=>{
      clutchScoredTotal[p] = (clutchScoredTotal[p]||0) + ins.clutchScored[p];
    });
    Object.keys(ins.halves).forEach(p=>{
      if(!halvesAgg[p]) halvesAgg[p] = {firstErr:0, firstTotal:0, secondErr:0, secondTotal:0};
      halvesAgg[p].firstErr += ins.halves[p].firstErr;
      halvesAgg[p].firstTotal += ins.halves[p].firstTotal;
      halvesAgg[p].secondErr += ins.halves[p].secondErr;
      halvesAgg[p].secondTotal += ins.halves[p].secondTotal;
    });
  });
  const fatigue = {};
  Object.keys(halvesAgg).forEach(p=>{
    const h = halvesAgg[p];
    if(h.firstTotal>=2 && h.secondTotal>=2){
      const firstRate = h.firstErr/h.firstTotal, secondRate = h.secondErr/h.secondTotal;
      if(secondRate - firstRate >= 0.15) fatigue[p] = {firstRate, secondRate};
    }
  });
  let topClutch = null;
  Object.keys(clutchScoredTotal).forEach(p=>{
    if(clutchScoredTotal[p]>=2 && (!topClutch || clutchScoredTotal[p]>clutchScoredTotal[topClutch])) topClutch = p;
  });
  return { bestStreak, topClutch, clutchCount: topClutch?clutchScoredTotal[topClutch]:0, fatigue };
}

const TREND_SUMMARY_LINES = {

const INTRO_STATS = [
  'היום {שיחק|שיחקה} {matches} משח{matchesSuffix} — {pos} נקודות זכות מול {neg} נקודות חובה, הפרש {diff}. יבש, ענייני, בלי מקום לוויכוחים.',
  '{matches} משח{matchesSuffix} על השעון, {pos} זכות מול {neg} חובה. הפרש {diff} — שהמספרים ידברו, {הוא|היא} כבר {דיבר|דיברה} מספיק על המגרש.',
  'קוד המספרים של היום: {matches} משח{matchesSuffix}, {pos} זכות, {neg} חובה, הפרש {diff}. לא צריך תואר בסטטיסטיקה בשביל להבין מי {ניצח|ניצחה} כאן.',
];
const PARTNERS_ONE = [
  '{שיחק|שיחקה} לצד {partner} לכל אורך המפגש — מעין נישואים זמניים על המגרש, בלי הסכם ממון.',
  'הצמד הבלעדי של היום: {partner}. בלי בגידות, בלי דרמות, נאמנות מופתית.',
  '{היה|הייתה} עם {partner} בכל משחק — שותפות שלא התפרקה אפילו לרגע.',
];
const PARTNERS_MULTI = [
  '{התחלף|התחלפה} בין כמה זוגות היום — {שיחק|שיחקה} לצד {partners}. אין נאמנות במגרש הזה, יש רק ניצחונות.',
  '{עבר|עברה} בין שותפים כמו באפליקציית דייטינג: {partners}. עדיין {מחפש|מחפשת} את השידוך המושלם.',
  '{עבר|עברה} בין כמה צמדים היום: {partners} — {גמיש|גמישה} מספיק בשביל לשחק עם כולם.',
];

function renderSummarySubview(session){
  __pickUsage = new Map(); // fresh anti-repeat tracking for this summary render
  const finishedMatches = session.matches.filter(m=>m.finished);
  const stats = computeSessionPlayerStats(session);
  const names = session.playersPresent.slice();
  const seed = session.id;
  const notes = (session.notes||'').trim();
  const insights = computeSessionInsights(session);

  // ---- 1. Match results ----
  let resultsHtml = finishedMatches.length
    ? finishedMatches.map(m=>{
        const winPair = m.winner==='A'?m.pairA:m.pairB;
        const losePair = m.winner==='A'?m.pairB:m.pairA;
        const winPts = m.winner==='A'?m.pointsA:m.pointsB;
        const losePts = m.winner==='A'?m.pointsB:m.pointsA;
        return `<p>${esc(winPair.join(' + '))} ניצחו את ${esc(losePair.join(' + '))} ${winPts}:${losePts}${m.star?' ⭐':''}.</p>`;
      }).join('')
    : `<p class="hint">לא נרשמו משחקים שהושלמו במפגש זה.</p>`;

  // ---- 2. Ranking for the day (net points, tie-break wins) ----
  const ranked = names.filter(n=> stats[n] && stats[n].matches>0).sort((a,b)=>{
    const na = stats[a].pos - stats[a].neg, nb = stats[b].pos - stats[b].neg;
    if(nb!==na) return nb-na;
    return stats[b].wins - stats[a].wins;
  });
  const medals = ['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣','7️⃣','8️⃣','9️⃣'];

  // ---- 3. Per-player analysis ("מה אפשר להסיק") — data-driven but with personality ----
  const IMPAIRMENT_KEYWORDS = ['פצע','פציע','פגע','פגיע','נחבל','כאב','כואב','חולה','לא טוב','עייף','מותש','נקע','תפס','קדחת','מצונן','חום'];
  const noteSentences = notes ? notes.split(/[.!?\n]+/).map(s=>s.trim()).filter(Boolean) : [];
  const noteAttached = new Set();
  let analysisHtml = '';
  ranked.forEach(n=>{
    const st = stats[n];
    const parts = [];
    // Only the sentence(s) that actually mention this player — not the whole notes blob — and only
    // treat it as an excuse that should soften the data-driven read if it sounds like an injury/illness/fatigue note.
    const myNoteSentences = noteSentences.filter(s=>s.includes(n));
    const mentionedInNotes = myNoteSentences.length>0;
    const impaired = mentionedInNotes && myNoteSentences.some(s=> IMPAIRMENT_KEYWORDS.some(k=>s.includes(k)));

    // Baseline sentences that always appear, so every player gets a fuller writeup regardless of which
    // situational insights below happen to apply to them.
    const diff = st.pos - st.neg;
    const diffText = (diff>=0?'+':'')+diff;
    parts.push(tpl(pick(INTRO_STATS, seed+n+'in'), {matches:st.matches, matchesSuffix: st.matches===1?'ק':'קים', pos:st.pos, neg:st.neg, diff:diffText}));

    const allPartners = allPartnersFor(n, finishedMatches);
    if(allPartners.length===1){
      parts.push(tpl(pick(PARTNERS_ONE, seed+n+'p1'), {partner:esc(allPartners[0])}));
    } else if(allPartners.length>1){
      parts.push(tpl(pick(PARTNERS_MULTI, seed+n+'pm'), {partners:allPartners.map(esc).join(', ')}));
    }

    const partners = partnersWonWith(n, finishedMatches);
    if(st.wins>0){
      if(partners.length>=2){
        parts.push(tpl(pick(WIN_MULTI, seed+n+'wm'), {count:partners.length, partners:partners.map(esc).join(' ו-')}));
      } else if(partners.length===1){
        const timesText = st.wins>1 ? `${st.wins} פעמים` : 'פעם אחת';
        const timesTextCap = st.wins>1 ? `${st.wins} ניצחונות` : 'ניצחון אחד';
        parts.push(tpl(pick(WIN_SINGLE, seed+n+'ws'), {timesText, timesTextCap, partner:esc(partners[0])}));
      }
    } else {
      parts.push(tpl(pick(NO_WIN, seed+n+'nw'), {matches:st.matches, matchesSuffix: st.matches===1?'ק':'קים'}));
    }

    const cm = closestMatchFor(n, finishedMatches);
    if(cm && cm.margin<=1){
      parts.push(tpl(pick(CLOSE_MATCH, seed+n+'cm'), {score:`${cm.m.pointsA}:${cm.m.pointsB}`}));
    }

    // Was this player mostly carried by a partner in their wins tonight, or did they do the carrying?
    const theirWins = finishedMatches.filter(m=> m.winner && (m.winner==='A'?m.pairA:m.pairB).includes(n));
    let carriedCount=0, carrierCount=0, lastCarriedBy=null, lastCarriedPartner=null;
    theirWins.forEach(m=>{
      const c = detectMatchCarry(m);
      if(!c) return;
      if(c.carried===n){ carriedCount++; lastCarriedBy=c.carrier; }
      if(c.carrier===n){ carrierCount++; lastCarriedPartner=c.carried; }
    });
    if(carriedCount>0 && carriedCount>carrierCount){
      parts.push(tpl(pick(CARRIED_LINES, seed+n+'cd'), {partner: esc(lastCarriedBy)}));
    } else if(carrierCount>0 && carrierCount>carriedCount){
      parts.push(tpl(pick(CARRIER_LINES, seed+n+'cr'), {partner: esc(lastCarriedPartner)}));
    }

    const negT = st.negNet + st.negGlass;
    if(negT>=2 && !impaired){
      if(st.negNet > st.negGlass*1.5) parts.push(tpl(pick(ERR_NET, seed+n+'en'), {negNet:st.negNet, negT}));
      else if(st.negGlass > st.negNet*1.5) parts.push(tpl(pick(ERR_GLASS, seed+n+'eg'), {negGlass:st.negGlass, negT}));
      else parts.push(tpl(pick(ERR_MIXED, seed+n+'em'), {negT}));
    }

    if(insights.bestStreak.player===n && insights.bestStreak.len>=3){
      parts.push(tpl(pick(STREAK_LINES, seed+n+'sk'), {len:insights.bestStreak.len}));
    }
    if(insights.topClutch===n){
      parts.push(tpl(pick(CLUTCH_LINES, seed+n+'cl'), {count:insights.clutchCount}));
    }
    if(insights.fatigue[n] && !impaired){
      parts.push(tpl(pick(FATIGUE_LINES, seed+n+'ft'), {
        first: Math.round(insights.fatigue[n].firstRate*100),
        second: Math.round(insights.fatigue[n].secondRate*100)
      }));
    }

    const prev = findPreviousSessionStatsForPlayer(n, session.number);
    if(!impaired){
      if(prev){
        const curNet = (st.pos-st.neg)/st.matches;
        const diff2 = curNet - prev.net;
        if(diff2 > 0.4) parts.push(tpl(pick(TREND_UP, seed+n+'tu'), {prevNum:prev.sessionNumber}));
        else if(diff2 < -0.4) parts.push(tpl(pick(TREND_DOWN, seed+n+'td'), {prevNum:prev.sessionNumber}));
        else parts.push(tpl(pick(TREND_STABLE, seed+n+'ts'), {prevNum:prev.sessionNumber}));
      } else {
        parts.push(pick(DEBUT_LINE, seed+n+'db'));
      }
    }

    // Weave the note sentence(s) that mention this player directly into the writeup, as plain context —
    // not framed as "according to the note that was recorded". Only add the "so don't read too much into
    // the numbers" caveat when the note actually sounds like an injury/illness/fatigue excuse; a note that's
    // just a fun fact (e.g. "old friends") shouldn't be used to wave away their stats.
    if(mentionedInNotes && !noteAttached.has(n)){
      noteAttached.add(n);
      const noteText = esc(myNoteSentences.join('. '));
      parts.push(impaired ? `${noteText} — ולכן קשה להסיק מסקנות חדות מהנתונים {שלו|שלה} היום.` : `${noteText}.`);
    }

    const g = getGender(n);
    analysisHtml += `<p><strong>${esc(n)}</strong> — ${parts.map(p=>degender(p,g)).join(' ')}</p>`;
  });
  names.filter(n=> !stats[n] || stats[n].matches===0).forEach(n=>{
    analysisHtml += `<p><strong>${esc(n)}</strong> — ${degender('{הגיע|הגיעה} למפגש אך {לא נכנס|לא נכנסה} למשחק הפעם.', getGender(n))}</p>`;
  });

  // if the note mentions someone who wasn't captured above (e.g. present but no matches), still surface it once
  if(notes && !ranked.some(n=>noteAttached.has(n))){
    // no player name matched inside the note — show it as a general callout instead
  }

  // ---- 4. Trend ranking list ----
  let rankHtml = ranked.map((n,i)=>{
    const st = stats[n];
    const net = st.pos - st.neg;
    return `<p>${medals[i]||(i+1)+'.'} <strong>${esc(n)}</strong> — נטו ${net>=0?'+':''}${net}, ${st.wins} נצחונות</p>`;
  }).join('');

  // ---- 5. Opener + Closing ----
  const opener = pick(SUM_OPENERS, seed+'o');
  const closing = ranked.length>=2
    ? `${esc(ranked[0])} ו-${esc(ranked[1])} מובילים את התמונה של המפגש הזה${ranked.length>2?', כשהשאר מנסים לצמצם פערים. ':'. '}${pick(SUM_CLOSINGS, seed+'c')}`
    : pick(SUM_CLOSINGS, seed+'c');

  const stars = session.matches.filter(m=>m.star);
  let starsHtml = stars.length ? stars.map(m=>{
    const win = m.winner==='A'?m.pairA:m.pairB;
    return `<p>⭐ <strong>${esc(win.join(' ו-'))}</strong> סגרו משחק בניצחון נקי (40-0) — פשוט לא השאירו סיכוי.</p>`;
  }).join('') : '';

  const notesHtml = notes ? `<div class="card" id="notesCard"><h2>📝 הערות מהמפגש</h2><p class="hint" style="margin-bottom:0;">${esc(notes)}</p></div>` : '';

  const rows = names.slice().sort((a,b)=> ((stats[b]?.pos||0)-(stats[b]?.neg||0))-((stats[a]?.pos||0)-(stats[a]?.neg||0)));
  let tableRows = rows.map(n=>{
    const st = stats[n] || {pos:0,negNet:0,negGlass:0,neg:0,wins:0,matches:0};
    const diff = st.pos - st.neg;
    return `<tr><td>${esc(n)}</td><td>${st.wins}</td><td class="pos-n">+${st.pos}</td><td class="neg-n">-${st.neg}</td><td>${diff>=0?'+':''}${diff}</td><td>🥅${st.negNet} 🪟${st.negGlass}</td></tr>`;
  }).join('');

  // ---- 6. Trend summary — a second, separate summary based on the last few sessions, not just tonight ----
  const TREND_WINDOW = 5;
  const trendSessions = computeTrendWindow(session.number, TREND_WINDOW);
  const trendStats = computeTrendStats(trendSessions);
  const trendRanked = Object.keys(trendStats).sort((a,b)=>
    (trendStats[b].netSum/trendStats[b].sessions) - (trendStats[a].netSum/trendStats[a].sessions));
  let trendHtml = trendRanked.length ? trendRanked.map((n,i)=>{
    const t = trendStats[n];
    const avgNet = t.netSum / t.sessions;
    const avgNetText = (avgNet>=0?'+':'')+avgNet.toFixed(1);
    const winRate = t.matches ? Math.round(t.wins/t.matches*100) : 0;
    let sentence;
    if(t.sessions < 2){
      sentence = tpl(pick(TREND_SUMMARY_LINES.early, seed+n+'te'), {sessions:t.sessions, sessionsSuffix: t.sessions===1?'':'ים'});
    } else {
      const half = Math.max(1, Math.floor(t.perSessionNet.length/2));
      const early = t.perSessionNet.slice(0,half).reduce((a,b)=>a+b,0)/half;
      const late = t.perSessionNet.slice(-half).reduce((a,b)=>a+b,0)/half;
      let dir = 'stable';
      if(t.sessions>=3){
        if(late-early > 1) dir='up';
        else if(late-early < -1) dir='down';
      }
      sentence = tpl(pick(TREND_SUMMARY_LINES[dir], seed+n+'t'+dir), {sessions:t.sessions, avgNet:avgNetText, winRate});
    }
    const g = getGender(n);
    return `<p>${medals[i]||(i+1)+'.'} <strong>${esc(n)}</strong> — ${degender(sentence,g)}</p>`;
  }).join('') : '<p class="hint">אין עדיין מספיק נתונים למגמה.</p>';

  const isViewingLive = !viewingPastSessionId;
  return `
  <div id="summaryContent">
  <div class="card">
    <h2>סיכום מפגש #${session.number}</h2>
    <p class="hint">${fmtDate(session.date)} · ${finishedMatches.length} משחקים · ${session.playersPresent.length} שחקנים</p>
    <div class="summary-text"><p>${opener}</p></div>
  </div>
  <div class="card">
    <h2>תוצאות המשחקים במפגש</h2>
    <div class="summary-text">${resultsHtml}${starsHtml}</div>
  </div>
  ${notesHtml}
  <div class="card">
    <h2>מה אפשר להסיק?</h2>
    <div class="summary-text">${analysisHtml}<p style="margin-top:14px;">${closing}</p></div>
  </div>
  <div class="card">
    <h2>דירוג מגמה (לפי המפגש הזה בלבד)</h2>
    <div class="summary-text">${rankHtml || '<p class="hint">אין עדיין נתונים לדירוג.</p>'}</div>
  </div>
  <div class="card">
    <h2>טבלת המפגש</h2>
    <table class="stat-table">
      <thead><tr><th>שחקן/ית</th><th>נצחונות</th><th>נק׳ +</th><th>נק׳ -</th><th>הפרש</th><th>פירוט טעויות</th></tr></thead>
      <tbody>${tableRows}</tbody>
    </table>
  </div>
  <div class="card">
    <h2>📈 סיכום מגמתי — ${trendSessions.length} מפגשים אחרונים</h2>
    <p class="hint">לא רק הערב — איך כל אחד/ת נראה/ית לאורך התקופה האחרונה.</p>
    <div class="summary-text">${trendHtml}</div>
  </div>
  </div>
  <button class="btn accent block" onclick="copySummaryToClipboard()">📋 העתקת הסיכום לשליחה בוואטסאפ</button>
  <button class="btn accent block" style="margin-top:8px;" onclick="shareSessionImage('${session.id}')">📸 שיתוף כתמונה</button>
  <button class="btn ghost block" onclick="closeSummary('${session.id}', ${isViewingLive})">← חזרה לדף הבית</button>
  `;
}
// Scrapes the already-rendered summary cards and converts them into WhatsApp-friendly plain text
// (​*bold*​ headers/names, line breaks instead of tags), so the text always matches exactly what's on screen.
function copySummaryToClipboard(){
  const container = document.getElementById('summaryContent');
  if(!container) return;
  const cards = container.querySelectorAll('.card');
  const blocks = [];
  cards.forEach(card=>{
    if(card.querySelector('table')) return; // the raw stats table doesn't translate well to plain text
    if(card.id==='notesCard') return; // notes stay on-screen only, not copied into the WhatsApp text
    const h2 = card.querySelector('h2');
    const hint = card.querySelector(':scope > .hint');
    const body = card.querySelector('.summary-text');
    const lines = [];
    if(h2) lines.push('*'+h2.textContent.trim()+'*');
    if(hint) lines.push(hint.textContent.trim());
    if(body){
      let html = body.innerHTML;
      html = html.replace(/<strong>(.*?)<\/strong>/gi, '*$1*');
      html = html.replace(/<\/p>\s*<p[^>]*>/gi, '\n');
      html = html.replace(/<p[^>]*>/gi, '').replace(/<\/p>/gi, '');
      html = html.replace(/<br\s*\/?>/gi, '\n');
      html = html.replace(/<[^>]+>/g, '');
      const ta = document.createElement('textarea');
      ta.innerHTML = html;
      const text = ta.value.trim();
      if(text) lines.push(text);
    }
    if(lines.length) blocks.push(lines.join('\n'));
  });
  const finalText = ('🎾 '+blocks.join('\n\n')).trim();
  const done = ()=> toast('הסיכום הועתק! אפשר להדביק בוואטסאפ');
  const fail = ()=> toast('לא הצלחנו להעתיק אוטומטית — אפשר לסמן ולהעתיק ידנית');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(finalText).then(done).catch(()=>{
      try{
        const ta2 = document.createElement('textarea');
        ta2.value = finalText;
        ta2.style.position='fixed'; ta2.style.opacity='0';
        document.body.appendChild(ta2); ta2.select();
        document.execCommand('copy');
        document.body.removeChild(ta2);
        done();
      }catch(e){ fail(); }
    });
  } else {
    try{
      const ta2 = document.createElement('textarea');
      ta2.value = finalText;
      ta2.style.position='fixed'; ta2.style.opacity='0';
      document.body.appendChild(ta2); ta2.select();
      document.execCommand('copy');
      document.body.removeChild(ta2);
      done();
    }catch(e){ fail(); }
  }
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ======================= STATS VIEW ======================= */
// League table: win=3 points, loss=0. Ranked by points, then net point difference, then wins.
function computeLeagueTable(){
  const {players} = buildGlobalStats();
  const rows = Object.keys(players).filter(p=>players[p].matches>0).map(p=>{
    const st = players[p];
    const losses = st.matches - st.wins;
    return { name:p, played:st.matches, won:st.wins, lost:losses, points: st.wins*3, diff: st.pos-st.neg };
  });
  rows.sort((a,b)=> b.points-a.points || b.diff-a.diff || b.won-a.won);
  return rows;
}
// Head-to-head: for every finished doubles match, each player on side A is credited a "matchup" win/loss
// against every player on side B (and vice versa) — the natural way to extend 1v1 rivalry tracking to doubles.
function computeHeadToHead(){
  const h2h = {}; // h2h[p1][p2] = {wins, losses}
  allMatches().forEach(m=>{
    m.pairA.forEach(p1=>{
      m.pairB.forEach(p2=>{
        if(!h2h[p1]) h2h[p1] = {};
        if(!h2h[p1][p2]) h2h[p1][p2] = {wins:0, losses:0};
        if(!h2h[p2]) h2h[p2] = {};
        if(!h2h[p2][p1]) h2h[p2][p1] = {wins:0, losses:0};
        if(m.winner==='A'){ h2h[p1][p2].wins++; h2h[p2][p1].losses++; }
        else { h2h[p1][p2].losses++; h2h[p2][p1].wins++; }
      });
    });
  });
  return h2h;
}
// A fun, mostly-lighthearted badge board computed from career totals. Badges only appear once a
// player clears a minimum sample size, so a single lucky/unlucky match doesn't crown or shame anyone.
// "Loser's curse" — held by the losing pair of the most recently finished match anywhere in the league,
// until someone else loses a match and takes it over. Pure shame, no upside.
// The single best session of this player's career, by net points that day. Used on their player card.
// League standings computed using only matches through `uptoSessionNumber` — used to plot how a
// player's rank moved over time, not just where they stand today.
function computeLeagueTableUpTo(uptoSessionNumber){
  const agg = {};
  state.sessions.filter(s=>s.finished && s.number<=uptoSessionNumber).forEach(s=>{
    const stats = computeSessionPlayerStats(s);
    Object.keys(stats).forEach(p=>{
      if(stats[p].matches===0) return;
      if(!agg[p]) agg[p] = {wins:0, matches:0, pos:0, neg:0};
      agg[p].wins += stats[p].wins;
      agg[p].matches += stats[p].matches;
      agg[p].pos += stats[p].pos;
      agg[p].neg += stats[p].neg;
    });
  });
  const rows = Object.keys(agg).map(p=>({ name:p, points: agg[p].wins*3, diff: agg[p].pos-agg[p].neg, wins: agg[p].wins }));
  rows.sort((a,b)=> b.points-a.points || b.diff-a.diff || b.wins-a.wins);
  return rows;
}
// Four progression series for a player's chart on their card: net points/session, league rank over
// time (since session #1, not just a recent window), error rate %, and clutch-scoring %.
function computeProgressionSeries(name){
  const sessions = allFinishedSessions();
  const labels=[], net=[], rank=[], errRate=[], clutchPct=[];
  sessions.forEach(s=>{
    const stats = computeSessionPlayerStats(s);
    const st = stats[name];
    if(!st || st.matches===0) return;
    labels.push('מפגש #'+s.number);
    net.push(+(st.pos-st.neg));
    const totalPts = st.pos+st.neg;
    errRate.push(totalPts>0 ? Math.round((st.neg/totalPts)*100) : 0);

    const table = computeLeagueTableUpTo(s.number);
    const r = table.findIndex(row=>row.name===name)+1;
    rank.push(r || table.length+1);

    let clutchCount=0;
    s.matches.filter(m=>m.finished).forEach(m=>{
      const ins = computeMatchInsights(m);
      clutchCount += ins.clutchScored[name] || 0;
    });
    clutchPct.push(st.pos>0 ? Math.round((clutchCount/st.pos)*100) : 0);
  });
  return { labels, net, rank, errRate, clutchPct };
}
function bestSessionFor(name){
  let best=null;
  state.sessions.filter(s=>s.finished).forEach(s=>{
    const stats = computeSessionPlayerStats(s);
    const st = stats[name];
    if(!st || st.matches===0) return;
    const diff = st.pos-st.neg;
    if(!best || diff>best.diff) best = { sessionNumber:s.number, date:s.date, diff, wins:st.wins, matches:st.matches };
  });
  return best;
}
// The opponent this player has faced the most, and how that rivalry stands — their "biggest nemesis".
function topRivalFor(name){
  const h2h = computeHeadToHead();
  const opponents = h2h[name] ? Object.keys(h2h[name]) : [];
  let best=null;
  opponents.forEach(opp=>{
    const rec = h2h[name][opp];
    const total = rec.wins+rec.losses;
    if(total>0 && (!best || total>best.total)) best = { name:opp, wins:rec.wins, losses:rec.losses, total };
  });
  return best;
}
// "Loser's curse" — held by whoever lost the most matches (not who lost the very last point) in the
// most recent session with any finished matches. Ties (a rough night for more than one player) are
// all named, held jointly until someone else out-loses them in a later session.
// Tallies, across every finished session in the league's whole history, how many times each player
// held the loser's-curse title (most match-losses in that session; ties all count).
function computeCurseHistory(){
  const counts = {};
  state.sessions.filter(s=>s.matches.some(m=>m.finished)).forEach(s=>{
    const stats = computeSessionPlayerStats(s);
    let maxLosses = 0;
    Object.keys(stats).forEach(p=>{
      if(stats[p].matches===0) return;
      const losses = stats[p].matches - stats[p].wins;
      if(losses>maxLosses) maxLosses = losses;
    });
    if(maxLosses<=0) return;
    Object.keys(stats).forEach(p=>{
      if(stats[p].matches>0 && (stats[p].matches-stats[p].wins)===maxLosses){
        counts[p] = (counts[p]||0) + 1;
      }
    });
  });
  return counts;
}
function getCurseHolders(){
  const sessionsDesc = state.sessions.slice().sort((a,b)=>b.number-a.number);
  for(const s of sessionsDesc){
    const finished = s.matches.filter(m=>m.finished);
    if(finished.length===0) continue;
    const stats = computeSessionPlayerStats(s);
    let maxLosses = 0;
    Object.keys(stats).forEach(p=>{
      if(stats[p].matches===0) return;
      const losses = stats[p].matches - stats[p].wins;
      if(losses>maxLosses) maxLosses = losses;
    });
    if(maxLosses<=0) return null; // nobody lost a single match that session
    const worstPlayers = Object.keys(stats).filter(p=> stats[p].matches>0 && (stats[p].matches-stats[p].wins)===maxLosses);
    return { players: worstPlayers, sessionNumber: s.number, losses: maxLosses };
  }
  return null;
}
function computeAchievements(){
  const {players, pairs} = buildGlobalStats();
  const eligible = Object.keys(players).filter(p=>players[p].matches>=3);
  const badges = [];
  function top(list, keyFn, min){
    let best=null, bestVal=-Infinity;
    list.forEach(p=>{ const v=keyFn(players[p]); if(v>bestVal && (min===undefined || players[p].matches>=min)){ best=p; bestVal=v; } });
    return best ? {name:best, value:bestVal} : null;
  }
  const mostWins = top(eligible, p=>p.wins);
  if(mostWins) badges.push({emoji:'🏆', title:'אלוף הליגה', desc:`הכי הרבה ניצחונות בסך הכול — ${mostWins.value}`, player:mostWins.name});

  const bestRate = top(eligible, p=> p.matches? p.wins/p.matches : 0);
  if(bestRate) badges.push({emoji:'🎯', title:'הכי מדויק/ת', desc:`אחוז ניצחון הכי גבוה — ${Math.round(bestRate.value*100)}%`, player:bestRate.name});

  const mostNet = top(eligible, p=> p.pos-p.neg);
  if(mostNet) badges.push({emoji:'📈', title:'ההפרש הכי גבוה', desc:`נטו נקודות מצטבר — ${mostNet.value>=0?'+':''}${mostNet.value}`, player:mostNet.name});

  const mostStars = top(eligible, p=>p.stars||0);
  if(mostStars && mostStars.value>0) badges.push({emoji:'⭐', title:'מלך/ת הניצחונות הנקיים', desc:`${mostStars.value} ניצחונות 40-0`, player:mostStars.name});

  const mostNet_ = top(eligible, p=>p.negNet||0);
  if(mostNet_ && mostNet_.value>0) badges.push({emoji:'🥅', title:'מלך/ת הרשת', desc:`${mostNet_.value} טעויות רשת בקריירה`, player:mostNet_.name});

  const mostGlass = top(eligible, p=>p.negGlass||0);
  if(mostGlass && mostGlass.value>0) badges.push({emoji:'🪟', title:'מלך/ת הזכוכית', desc:`${mostGlass.value} כדורים שטסו החוצה`, player:mostGlass.name});

  const mostSessions = top(eligible, p=>p.sessions||0);
  if(mostSessions) badges.push({emoji:'📅', title:'הכי נאמן/ה לליגה', desc:`${mostSessions.value} מפגשים`, player:mostSessions.name});

  let bestPairKey=null, bestPairVal=-Infinity;
  Object.keys(pairs).forEach(pk=>{
    const pr = pairs[pk];
    if(pr.matches>=3 && pr.wins>bestPairVal){ bestPairVal=pr.wins; bestPairKey=pk; }
  });
  if(bestPairKey) badges.push({emoji:'🤝', title:'הצמד הכי מנצח', desc:`${bestPairVal} ניצחונות יחד`, player:pairs[bestPairKey].players.join(' + ')});

  const curseCounts = computeCurseHistory();
  let mostCursedName=null, mostCursedVal=0;
  Object.keys(curseCounts).forEach(p=>{
    if(curseCounts[p]>mostCursedVal){ mostCursedVal=curseCounts[p]; mostCursedName=p; }
  });
  if(mostCursedName) badges.push({emoji:'🗑️', title:'הכי מקולל/ת', desc:`${mostCursedVal} פעמים החזיק/ה בקללת המפסיד`, player:mostCursedName});

  return badges;
}
function buildGlobalStats(){
  const players = {};
  state.players.forEach(p=> players[p] = {wins:0, matches:0, sessions:0, pos:0, negNet:0, negGlass:0, neg:0, stars:0, partners:{}});
  const pairs = {};
  allMatches().forEach(m=>{
    const winners = m.winner==='A'?m.pairA:m.pairB;
    [m.pairA, m.pairB].forEach((pair, idx)=>{
      const isWinner = (idx===0 && m.winner==='A') || (idx===1 && m.winner==='B');
      const pk = pairKey(pair);
      if(!pairs[pk]) pairs[pk] = {players:pair, wins:0, matches:0, stars:0, pos:0, neg:0};
      pairs[pk].matches++;
      if(isWinner) pairs[pk].wins++;
      if(m.star && isWinner) pairs[pk].stars++;
      pair.forEach(p=>{
        if(!players[p]) players[p]={wins:0,matches:0,sessions:0,pos:0,negNet:0,negGlass:0,neg:0,stars:0,partners:{}};
        players[p].matches++;
        players[p].pos += m.individual[p]?.pos||0;
        players[p].negNet += m.individual[p]?.negNet||0;
        players[p].negGlass += m.individual[p]?.negGlass||0;
        players[p].neg = players[p].negNet + players[p].negGlass;
        pairs[pk].pos += m.individual[p]?.pos||0;
        pairs[pk].neg += negTotal(m.individual[p]||{negNet:0,negGlass:0});
        if(isWinner){ players[p].wins++; if(m.star) players[p].stars++; }
        const partner = pair.find(x=>x!==p);
        if(!players[p].partners[partner]) players[p].partners[partner]={wins:0,matches:0};
        players[p].partners[partner].matches++;
        if(isWinner) players[p].partners[partner].wins++;
      });
    });
  });
  // Session attendance is counted separately from match stats above, so a player who showed up
  // but for some reason didn't get into a match that day is still counted as having attended.
  state.sessions.forEach(s=>{
    (s.playersPresent||[]).forEach(p=>{
      if(!players[p]) players[p]={wins:0,matches:0,sessions:0,pos:0,negNet:0,negGlass:0,neg:0,stars:0,partners:{}};
      players[p].sessions++;
    });
  });
  return {players, pairs};
}
function computeClutchGlobalStats(){
  const matches = allMatches();
  let deuceCount = 0;
  const winCounts = {};
  matches.forEach(m=>{
    let a=0, b=0, reached=false;
    m.events.forEach(ev=>{
      if(isClutch(a,b)) reached = true;
      if(ev.kind==='pos'){ if(ev.actingPair==='A') a++; else b++; }
      else { if(ev.actingPair==='A') b++; else a++; }
    });
    if(reached){
      deuceCount++;
      const winners = m.winner==='A'?m.pairA:m.pairB;
      winners.forEach(p=> winCounts[p]=(winCounts[p]||0)+1);
    }
  });
  return { deuceCount, totalMatches: matches.length, winCounts };
}

let trendChartInst=null, fitChartInst=null, winRateChartInst=null, compareChartInst=null, progressionChartInst=null;
const COMPARE_COLORS = ['#D8EA4B','#E3703C','#1D8A73','#F0C24B','#7CB8E0','#C97BD8','#E86BA0','#8ABF6A','#E0A15C','#6E9BE0'];
function chartsAvailable(){
  if(typeof Chart === 'undefined'){
    document.querySelectorAll('canvas').forEach(c=>{
      const warn = document.createElement('p');
      warn.className = 'hint';
      warn.style.color = 'var(--danger)';
      warn.textContent = '⚠ לא ניתן לטעון את ספריית הגרפים (Chart.js) — בדקו חיבור אינטרנט ורעננו את הדף.';
      c.replaceWith(warn);
    });
    return false;
  }
  return true;
}
function afterStatsRender(){
  if(!chartsAvailable()) return;
  if(statsSubtab==='card' && selectedCardPlayer){
    const series = computeProgressionSeries(selectedCardPlayer);
    const metricConfig = {
      net: { data: series.net, label:'הפרש נטו', color:'#D8EA4B', reverse:false },
      rank: { data: series.rank, label:'מיקום בטבלה', color:'#F0C24B', reverse:true },
      errRate: { data: series.errRate, label:'% טעויות', color:'#E2543B', reverse:false },
      clutchPct: { data: series.clutchPct, label:'% נקודות בקלאץ׳', color:'#7CB8E0', reverse:false },
    };
    const cfg = metricConfig[progressionMetric] || metricConfig.net;
    try{
      const ctx = document.getElementById('progressionChart');
      if(ctx){
        if(progressionChartInst){ progressionChartInst.destroy(); progressionChartInst=null; }
        if(series.labels.length){
          progressionChartInst = new Chart(ctx, {
            type:'line',
            data:{ labels: series.labels, datasets:[{ label:cfg.label, data:cfg.data, borderColor:cfg.color, backgroundColor:cfg.color+'26', tension:.3, fill:true, pointBackgroundColor:cfg.color }]},
            options:{ plugins:{legend:{labels:{color:'#94ADB2'}}}, scales:{
              x:{ticks:{color:'#94ADB2'}, grid:{color:'#2C4B53'}},
              y:{ticks:{color:'#94ADB2'}, grid:{color:'#2C4B53'}, reverse:cfg.reverse, ...(cfg.reverse?{min:1}:{})}
            }}
          });
        }
      }
    }catch(e){ console.error('progressionChart error', e); }
  }
  if(statsSubtab==='trend' && selectedTrendPlayer){
    const sessions = allFinishedSessions();
    const labels = [], data = [], winRateData = [];
    sessions.forEach(s=>{
      let pos=0,neg=0,matches=0,wins=0;
      s.matches.filter(m=>m.finished).forEach(m=>{
        if(m.individual[selectedTrendPlayer]){
          matches++; pos+=m.individual[selectedTrendPlayer].pos; neg+=negTotal(m.individual[selectedTrendPlayer]);
          const winners = m.winner==='A'?m.pairA:m.pairB;
          if(winners.includes(selectedTrendPlayer)) wins++;
        }
      });
      if(matches>0){
        labels.push('מפגש '+s.number);
        data.push(+((pos-neg)/matches).toFixed(2));
        winRateData.push(Math.round(wins/matches*100));
      }
    });
    try{
      const ctx = document.getElementById('trendChart');
      if(ctx){
        if(trendChartInst){ trendChartInst.destroy(); trendChartInst=null; }
        trendChartInst = new Chart(ctx, {
          type:'line',
          data:{ labels, datasets:[{ label:'נק׳ נטו ממוצע', data, borderColor:'#D8EA4B', backgroundColor:'rgba(216,234,75,.15)', tension:.3, fill:true, pointBackgroundColor:'#1D8A73' }]},
          options:{ plugins:{legend:{labels:{color:'#94ADB2'}}}, scales:{
            x:{ticks:{color:'#94ADB2'}, grid:{color:'#2C4B53'}},
            y:{ticks:{color:'#94ADB2'}, grid:{color:'#2C4B53'}}
          }}
        });
      }
    }catch(e){ console.error('trendChart error', e); }
    try{
      const ctx2 = document.getElementById('winRateChart');
      if(ctx2){
        if(winRateChartInst){ winRateChartInst.destroy(); winRateChartInst=null; }
        winRateChartInst = new Chart(ctx2, {
          type:'line',
          data:{ labels, datasets:[{ label:'% ניצחון', data:winRateData, borderColor:'#E3703C', backgroundColor:'rgba(227,112,60,.15)', tension:.3, fill:true, pointBackgroundColor:'#E3703C' }]},
          options:{ plugins:{legend:{labels:{color:'#94ADB2'}}}, scales:{
            x:{ticks:{color:'#94ADB2'}, grid:{color:'#2C4B53'}},
            y:{ticks:{color:'#94ADB2'}, grid:{color:'#2C4B53'}, min:0, max:100}
          }}
        });
      }
    }catch(e){ console.error('winRateChart error', e); }
    try{
      const ctx3 = document.getElementById('compareChart');
      if(ctx3){
        if(compareChartInst){ compareChartInst.destroy(); compareChartInst=null; }
        const {players} = buildGlobalStats();
        const allNames = Object.keys(players).filter(p=>players[p].matches>0);
        const datasets = allNames.map((n,i)=>{
          const d = [];
          sessions.forEach(s=>{
            let pos=0,neg=0,matches=0;
            s.matches.filter(m=>m.finished).forEach(m=>{
              if(m.individual[n]){ matches++; pos+=m.individual[n].pos; neg+=negTotal(m.individual[n]); }
            });
            d.push(matches>0 ? +((pos-neg)/matches).toFixed(2) : null);
          });
          const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
          return { label:n, data:d, borderColor:color, backgroundColor:color, tension:.3, spanGaps:true, pointRadius:3 };
        });
        compareChartInst = new Chart(ctx3, {
          type:'line',
          data:{ labels, datasets },
          options:{ plugins:{legend:{labels:{color:'#94ADB2', boxWidth:12}}}, scales:{
            x:{ticks:{color:'#94ADB2'}, grid:{color:'#2C4B53'}},
            y:{ticks:{color:'#94ADB2'}, grid:{color:'#2C4B53'}}
          }}
        });
      }
    }catch(e){ console.error('compareChart error', e); }
  }
  if(statsSubtab==='fit' && selectedFitPlayer){
    const {players} = buildGlobalStats();
    const partners = players[selectedFitPlayer]?.partners || {};
    const labels = Object.keys(partners);
    const data = labels.map(l=> partners[l].matches ? Math.round(partners[l].wins/partners[l].matches*100) : 0);
    const ctx = document.getElementById('fitChart');
    if(ctx){
      if(labels.length===0){
        const msg = document.createElement('p');
        msg.className = 'hint';
        msg.textContent = `${selectedFitPlayer} עדיין לא שיחק/ה עם מספיק שותפים שונים כדי להציג השוואה.`;
        ctx.replaceWith(msg);
      } else {
        try{
          if(fitChartInst){ fitChartInst.destroy(); fitChartInst=null; }
          fitChartInst = new Chart(ctx, {
            type:'bar',
            data:{ labels, datasets:[{ label:'% נצחון יחד', data, backgroundColor:'#1D8A73', borderRadius:6 }]},
            options:{ plugins:{legend:{display:false}}, scales:{
              x:{ticks:{color:'#94ADB2'}, grid:{display:false}},
              y:{ticks:{color:'#94ADB2'}, grid:{color:'#2C4B53'}, max:100}
            }}
          });
        }catch(e){ console.error('fitChart error', e); }
      }
    }
  }
}
